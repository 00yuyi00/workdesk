<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据可视化与任务管理面板</title>
    <!-- 引入 Tailwind CSS 进行样式管理 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // 配置 Tailwind 颜色主题 (淡黄色苹果风格)
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'apple-yellow': '#FDFBF7', // 极淡的黄色背景
                        'apple-yellow-dark': '#F5F0E6', // 稍微深一点的黄色，用于高亮或边框
                        'apple-gray': '#F5F5F7',
                        'apple-text': '#1D1D1F',
                        'apple-blue': '#0071E3',
                        'apple-border': '#D2D2D7',
                        'panel-bg': '#FFFFFF',
                    },
                    boxShadow: {
                        'apple': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                        'apple-hover': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                    },
                    fontFamily: {
                        'sans': ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #FDFBF7; /* 全局淡黄色背景 */
            color: #1D1D1F;
        }
        
        /* 隐藏原生滚动条，使用自定义样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #D2D2D7;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #86868B;
        }

        /* 玻璃拟态效果 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .transition-all-custom {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 表格样式优化 */
        .apple-table th {
            background-color: #F5F5F7;
            font-weight: 600;
            color: #1D1D1F;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        .apple-table tr {
            border-bottom: 1px solid #E5E5EA;
            transition: background-color 0.2s;
        }
        .apple-table tr:hover {
            background-color: #F5F0E6; /* 悬停时淡黄色高亮 */
        }
        .apple-table td {
            color: #48484A;
        }

        /* 图片预览容器 */
        #mediaPreviewContainer img, #mediaPreviewContainer iframe {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden font-sans flex text-apple-text">

    <!-- 左侧边栏：任务列表 -->
    <aside class="w-64 flex-shrink-0 glass-panel border-r border-apple-border flex flex-col z-10 shadow-sm">
        <div class="p-5 border-b border-apple-border flex justify-between items-center bg-white/50">
            <h2 class="text-xl font-bold tracking-tight">任务列表</h2>
            <button onclick="createNewTask()" class="text-apple-blue hover:text-blue-700 transition-colors p-2 rounded-full hover:bg-apple-gray" title="新建任务">
                <i class="fas fa-plus text-lg"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-3" id="taskListContainer">
            <!-- 任务列表项将通过 JS 动态生成 -->
            <div class="text-center text-gray-400 mt-10 text-sm">暂无任务，请新建</div>
        </div>
    </aside>

    <!-- 主体内容区域 -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        
        <!-- 空白状态提示 (当没有选择任务时显示) -->
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center bg-apple-yellow z-20 transition-opacity duration-300">
            <i class="fas fa-layer-group text-6xl text-gray-300 mb-4"></i>
            <h2 class="text-2xl font-semibold text-gray-500 mb-2">未选择任务</h2>
            <p class="text-gray-400">请从左侧选择一个任务或创建新任务</p>
        </div>

        <!-- 当前任务内容区 (隐藏状态下为 hidden) -->
        <div id="taskContentArea" class="flex-1 flex flex-col h-full hidden">
            
            <!-- 顶部面板：统计、筛选、备注 -->
            <header class="glass-panel border-b border-apple-border p-6 shadow-sm z-10 flex-shrink-0 bg-white/80">
                <div class="flex flex-col md:flex-row gap-6 mb-4">
                    <!-- 统计信息 -->
                    <div class="flex-1 flex gap-4">
                        <div class="bg-apple-gray rounded-xl p-4 flex-1 shadow-inner border border-gray-100">
                            <div class="text-sm text-gray-500 font-medium mb-1">当前任务</div>
                            <div class="text-lg font-bold truncate" id="currentTaskNameDisplay">加载中...</div>
                        </div>
                        <div class="bg-apple-yellow-dark rounded-xl p-4 flex-1 shadow-inner border border-yellow-100">
                            <div class="text-sm text-yellow-700 font-medium mb-1"><i class="fas fa-map-marker-alt mr-1"></i> 站点总数</div>
                            <div class="text-2xl font-bold text-yellow-800" id="totalSitesCount">0</div>
                        </div>
                    </div>
                    
                    <!-- 筛选控制 -->
                    <div class="flex-1 flex flex-col justify-center border-l md:border-l-0 md:border-l border-apple-border pl-0 md:pl-6">
                        <div class="text-sm text-gray-500 font-medium mb-2"><i class="fas fa-filter mr-1"></i> 岗位编码筛选</div>
                        <div class="flex bg-apple-gray p-1 rounded-lg self-start">
                            <button onclick="setFilter('all')" id="filter-all" class="px-4 py-1.5 rounded-md text-sm font-medium transition-colors bg-white shadow-sm text-apple-text">全部</button>
                            <button onclick="setFilter('has_code')" id="filter-has-code" class="px-4 py-1.5 rounded-md text-sm font-medium transition-colors text-gray-500 hover:text-apple-text">有编码</button>
                            <button onclick="setFilter('no_code')" id="filter-no-code" class="px-4 py-1.5 rounded-md text-sm font-medium transition-colors text-gray-500 hover:text-apple-text">无编码</button>
                        </div>
                    </div>
                </div>

                <!-- 备注栏 -->
                <div class="mt-2 relative">
                    <label for="taskNotes" class="block text-sm font-medium text-gray-500 mb-1"><i class="fas fa-edit mr-1"></i> 任务备注</label>
                    <textarea id="taskNotes" rows="2" 
                        class="w-full bg-white border border-apple-border rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-apple-blue/50 focus:border-apple-blue transition-shadow resize-none shadow-inner" 
                        placeholder="在此输入关于此任务的备注信息，将自动保存..."
                        onchange="saveCurrentTaskNotes()"></textarea>
                    <div id="saveIndicator" class="absolute right-3 bottom-3 text-xs text-green-500 opacity-0 transition-opacity"><i class="fas fa-check-circle"></i> 已保存</div>
                </div>
            </header>

            <!-- 核心工作区：左侧文件上传预览，右侧JSON表格 -->
            <div class="flex-1 flex flex-col lg:flex-row overflow-hidden bg-transparent">
                
                <!-- 左侧：文件/图片上传与预览区 -->
                <section class="w-full lg:w-1/3 border-b lg:border-b-0 lg:border-r border-apple-border flex flex-col bg-white/40">
                    <div class="p-4 border-b border-apple-border flex justify-between items-center bg-white/60">
                        <h3 class="font-semibold text-gray-700"><i class="fas fa-file-image mr-2"></i>文件预览区</h3>
                        <label for="fileUpload" class="cursor-pointer bg-apple-yellow-dark text-yellow-800 hover:bg-yellow-200 px-3 py-1.5 rounded-full text-sm font-medium transition-colors border border-yellow-200">
                            <i class="fas fa-upload mr-1"></i> 上传文件
                        </label>
                        <input type="file" id="fileUpload" class="hidden" onchange="handleFileUpload(event)" accept="image/*,.txt,.md,.json,.csv">
                    </div>
                    
                    <div class="flex-1 p-4 flex flex-col relative">
                        <!-- 拖拽提示区 -->
                        <div id="dropZone" class="absolute inset-4 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50/50 flex flex-col items-center justify-center text-gray-400 z-10 transition-colors"
                             ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                            <i class="fas fa-cloud-upload-alt text-4xl mb-3"></i>
                            <p class="text-sm font-medium">拖拽图片或文本文件到此处预览</p>
                        </div>
                        
                        <!-- 实际预览内容区 -->
                        <div id="mediaPreviewContainer" class="flex-1 flex items-center justify-center bg-white rounded-xl shadow-inner border border-gray-100 overflow-hidden relative z-0 p-2">
                            <!-- 内容将通过JS插入 -->
                        </div>
                        <div id="fileNameDisplay" class="mt-2 text-xs text-center text-gray-500 truncate hidden"></div>
                    </div>
                </section>

                <!-- 右侧：JSON 数据导入与可视化表格区 -->
                <section class="w-full lg:w-2/3 flex flex-col bg-white/60">
                    <div class="p-4 border-b border-apple-border flex justify-between items-center bg-white/60">
                        <h3 class="font-semibold text-gray-700"><i class="fas fa-table mr-2"></i>数据可视化</h3>
                        <div class="flex gap-2">
                            <button onclick="clearJsonData()" class="text-gray-500 hover:text-red-500 px-3 py-1.5 rounded-full text-sm font-medium transition-colors hidden" id="clearDataBtn">
                                <i class="fas fa-trash-alt"></i> 清除数据
                            </button>
                            <label for="jsonUpload" class="cursor-pointer bg-apple-blue text-white hover:bg-blue-600 px-4 py-1.5 rounded-full text-sm font-medium transition-colors shadow-sm">
                                <i class="fas fa-file-import mr-1"></i> 导入 JSON
                            </label>
                            <input type="file" id="jsonUpload" class="hidden" onchange="handleJsonUpload(event)" accept=".json">
                        </div>
                    </div>

                    <div class="flex-1 p-4 overflow-hidden flex flex-col">
                        <!-- 数据空状态 -->
                        <div id="dataEmptyState" class="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-gray-200 rounded-xl bg-gray-50/50">
                            <i class="fas fa-code text-4xl text-gray-300 mb-3"></i>
                            <p class="text-sm font-medium text-gray-500">请导入 JSON 文件以生成表格</p>
                            <p class="text-xs text-gray-400 mt-1">支持包含对象的数组格式</p>
                        </div>

                        <!-- 表格容器 -->
                        <div id="tableContainer" class="flex-1 overflow-auto rounded-xl shadow-apple border border-gray-200 bg-white hidden">
                            <table class="w-full text-left border-collapse apple-table relative" id="dataTable">
                                <thead class="sticky top-0 bg-gray-50 z-10 shadow-sm" id="tableHead">
                                    <!-- 表头通过 JS 动态生成 -->
                                </thead>
                                <tbody class="text-sm divide-y divide-gray-100" id="tableBody">
                                    <!-- 表格内容通过 JS 动态生成 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
        // --- 核心状态管理 ---
        let appState = {
            tasks: [], // 存储所有任务的数组
            currentTaskId: null, // 当前选中的任务 ID
            currentFilter: 'all' // 当前的岗位编码筛选状态: 'all', 'has_code', 'no_code'
        };

        // --- 初始化与本地存储 (localStorage) 交互 ---
        function initApp() {
            loadDataFromStorage();
            renderTaskList();
            
            // 如果有历史任务，默认选中第一个
            if (appState.tasks.length > 0) {
                selectTask(appState.tasks[0].id);
            } else {
                showEmptyState(true);
            }
        }

        function loadDataFromStorage() {
            const storedTasks = localStorage.getItem('appleStyleTasks');
            if (storedTasks) {
                try {
                    appState.tasks = JSON.parse(storedTasks);
                } catch (e) {
                    console.error("解析本地存储数据失败", e);
                    appState.tasks = [];
                }
            }
        }

        function saveToStorage() {
            localStorage.setItem('appleStyleTasks', JSON.stringify(appState.tasks));
        }

        // --- 任务管理逻辑 ---
        function createNewTask() {
            const taskId = 'task_' + Date.now();
            const date = new Date();
            const newTask = {
                id: taskId,
                name: `新建任务 ${date.getHours()}:${date.getMinutes()}`,
                createdAt: date.toLocaleString(),
                notes: "",
                jsonData: null, // 存储解析后的 JSON 数组
                previewFile: null // {type: 'image'|'text', src: string, name: string} 简化的预览数据存储
            };
            
            appState.tasks.unshift(newTask); // 添加到顶部
            saveToStorage();
            renderTaskList();
            selectTask(taskId);
        }

        function selectTask(taskId) {
            appState.currentTaskId = taskId;
            appState.currentFilter = 'all'; // 切换任务时重置筛选
            
            renderTaskList(); // 更新高亮状态
            showEmptyState(false);
            
            const task = appState.tasks.find(t => t.id === taskId);
            if (task) {
                // 更新顶部面板
                document.getElementById('currentTaskNameDisplay').innerText = task.name;
                document.getElementById('taskNotes').value = task.notes || "";
                updateFilterUI();
                
                // 恢复工作区状态
                restoreWorkspace(task);
            }
        }

        function deleteTask(event, taskId) {
            event.stopPropagation(); // 阻止触发选中事件
            if(confirm("确定要删除这个任务及其所有数据吗？")) {
                appState.tasks = appState.tasks.filter(t => t.id !== taskId);
                saveToStorage();
                
                if (appState.currentTaskId === taskId) {
                    appState.currentTaskId = null;
                    if (appState.tasks.length > 0) {
                        selectTask(appState.tasks[0].id);
                    } else {
                        showEmptyState(true);
                    }
                } else {
                    renderTaskList();
                }
            }
        }

        // --- STREAMING_CHUNK:UI 渲染与更新逻辑 ---
        function renderTaskList() {
            const container = document.getElementById('taskListContainer');
            container.innerHTML = '';
            
            if (appState.tasks.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 mt-10 text-sm">暂无历史任务，请新建</div>';
                return;
            }

            appState.tasks.forEach(task => {
                const isSelected = task.id === appState.currentTaskId;
                const div = document.createElement('div');
                div.className = `p-3 mb-2 rounded-xl cursor-pointer transition-all-custom group flex justify-between items-center border ${isSelected ? 'bg-white shadow-apple border-apple-yellow-dark' : 'hover:bg-white/50 border-transparent'}`;
                div.onclick = () => selectTask(task.id);
                
                div.innerHTML = `
                    <div class="overflow-hidden flex-1 pr-2">
                        <div class="font-medium text-sm truncate ${isSelected ? 'text-apple-blue' : 'text-gray-700'}">${task.name}</div>
                        <div class="text-xs text-gray-400 mt-1 truncate">${task.createdAt}</div>
                    </div>
                    <button class="text-gray-300 hover:text-red-500 p-1 opacity-0 group-hover:opacity-100 transition-opacity" onclick="deleteTask(event, '${task.id}')" title="删除">
                        <i class="fas fa-trash-alt text-sm"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function showEmptyState(show) {
            const emptyState = document.getElementById('emptyState');
            const contentArea = document.getElementById('taskContentArea');
            if (show) {
                emptyState.classList.remove('hidden');
                setTimeout(() => emptyState.style.opacity = '1', 10);
                contentArea.classList.add('hidden');
            } else {
                emptyState.style.opacity = '0';
                setTimeout(() => {
                    emptyState.classList.add('hidden');
                    contentArea.classList.remove('hidden');
                }, 300);
            }
        }

        // --- 备注功能 ---
        let saveTimeout;
        function saveCurrentTaskNotes() {
            if (!appState.currentTaskId) return;
            
            const notes = document.getElementById('taskNotes').value;
            const taskIndex = appState.tasks.findIndex(t => t.id === appState.currentTaskId);
            
            if (taskIndex !== -1) {
                appState.tasks[taskIndex].notes = notes;
                saveToStorage();
                
                // 显示保存成功提示
                const indicator = document.getElementById('saveIndicator');
                indicator.style.opacity = '1';
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    indicator.style.opacity = '0';
                }, 2000);
            }
        }

        // --- STREAMING_CHUNK:文件预览逻辑处理 ---
        // 恢复工作区 (切换任务时调用)
        function restoreWorkspace(task) {
            // 恢复预览区
            const dropZone = document.getElementById('dropZone');
            const previewContainer = document.getElementById('mediaPreviewContainer');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            
            if (task.previewFile) {
                dropZone.classList.add('hidden');
                previewContainer.innerHTML = '';
                fileNameDisplay.innerText = task.previewFile.name;
                fileNameDisplay.classList.remove('hidden');

                if (task.previewFile.type === 'image') {
                    const img = document.createElement('img');
                    img.src = task.previewFile.src;
                    previewContainer.appendChild(img);
                } else {
                    const pre = document.createElement('pre');
                    pre.className = "text-xs text-gray-600 p-4 w-full h-full overflow-auto whitespace-pre-wrap font-mono";
                    pre.textContent = task.previewFile.src;
                    previewContainer.appendChild(pre);
                }
            } else {
                dropZone.classList.remove('hidden');
                previewContainer.innerHTML = '';
                fileNameDisplay.classList.add('hidden');
            }

            // 恢复 JSON 表格
            if (task.jsonData && task.jsonData.length > 0) {
                renderTable(task.jsonData);
            } else {
                clearTableUI();
            }
        }

        // 处理文件上传 (左侧预览)
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            processFileForPreview(file);
        }

        // 拖放事件处理
        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('border-apple-blue', 'bg-blue-50/50');
        }
        function handleDragLeave(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('border-apple-blue', 'bg-blue-50/50');
        }
        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('border-apple-blue', 'bg-blue-50/50');
            const file = e.dataTransfer.files[0];
            if (file) processFileForPreview(file);
        }

        function processFileForPreview(file) {
            if (!appState.currentTaskId) {
                alert("请先选择或新建一个任务！");
                return;
            }

            const reader = new FileReader();
            
            reader.onload = (e) => {
                const isImage = file.type.startsWith('image/');
                const previewData = {
                    type: isImage ? 'image' : 'text',
                    src: e.target.result,
                    name: file.name
                };

                // 更新当前任务数据并保存
                const taskIndex = appState.tasks.findIndex(t => t.id === appState.currentTaskId);
                if (taskIndex !== -1) {
                    appState.tasks[taskIndex].previewFile = previewData;
                    saveToStorage();
                    restoreWorkspace(appState.tasks[taskIndex]); // 重新渲染预览区
                }
            };

            if (file.type.startsWith('image/')) {
                reader.readAsDataURL(file);
            } else {
                // 假设非图片为文本格式
                reader.readAsText(file);
            }
            
            // 重置 input，允许重复上传同名文件
            document.getElementById('fileUpload').value = '';
        }

        // --- STREAMING_CHUNK:JSON 数据处理与表格渲染逻辑 ---
        
        function handleJsonUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!appState.currentTaskId) {
                alert("请先选择或新建一个任务！");
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    // 确保数据是数组，如果不是则包装成数组
                    const dataArray = Array.isArray(data) ? data : [data];
                    
                    const taskIndex = appState.tasks.findIndex(t => t.id === appState.currentTaskId);
                    if (taskIndex !== -1) {
                        appState.tasks[taskIndex].jsonData = dataArray;
                        // 更新任务名称为文件名 (可选功能)
                        appState.tasks[taskIndex].name = file.name.replace('.json', '');
                        saveToStorage();
                        
                        document.getElementById('currentTaskNameDisplay').innerText = appState.tasks[taskIndex].name;
                        renderTaskList(); // 更新左侧列表名称
                        renderTable(dataArray);
                    }
                } catch (error) {
                    alert("JSON 文件解析失败，请确保格式正确。\n" + error.message);
                }
            };
            reader.readAsText(file);
            document.getElementById('jsonUpload').value = '';
        }

        function clearJsonData() {
            if (!appState.currentTaskId) return;
            const taskIndex = appState.tasks.findIndex(t => t.id === appState.currentTaskId);
            if (taskIndex !== -1) {
                appState.tasks[taskIndex].jsonData = null;
                saveToStorage();
                clearTableUI();
            }
        }

        function clearTableUI() {
            document.getElementById('dataEmptyState').classList.remove('hidden');
            document.getElementById('tableContainer').classList.add('hidden');
            document.getElementById('clearDataBtn').classList.add('hidden');
            updateStats([]); // 重置统计
        }

        // 获取列名（提取所有对象的所有键，以适应不规则的JSON）
        function extractHeaders(dataArray) {
            const headersSet = new Set();
            dataArray.forEach(item => {
                if (typeof item === 'object' && item !== null) {
                    Object.keys(item).forEach(key => headersSet.add(key));
                }
            });
            return Array.from(headersSet);
        }

        // 判断一个键是否可能是“岗位编码”相关的字段
        function isPostCodeField(key) {
            const lowerKey = key.toLowerCase();
            return lowerKey.includes('code') || lowerKey.includes('编码') || lowerKey.includes('代码') || lowerKey === 'id';
        }

        // 尝试找到数据中代表“岗位编码”的字段名
        function findPostCodeHeader(headers) {
            return headers.find(h => isPostCodeField(h));
        }

        function renderTable(dataArray) {
            if (!dataArray || dataArray.length === 0) {
                clearTableUI();
                return;
            }

            document.getElementById('dataEmptyState').classList.add('hidden');
            document.getElementById('tableContainer').classList.remove('hidden');
            document.getElementById('clearDataBtn').classList.remove('hidden');

            const headers = extractHeaders(dataArray);
            const codeHeader = findPostCodeHeader(headers);
            
            // --- 应用筛选逻辑 ---
            let filteredData = dataArray;
            if (codeHeader) {
                if (appState.currentFilter === 'has_code') {
                    filteredData = dataArray.filter(item => item[codeHeader] && item[codeHeader].toString().trim() !== '');
                } else if (appState.currentFilter === 'no_code') {
                    filteredData = dataArray.filter(item => !item[codeHeader] || item[codeHeader].toString().trim() === '');
                }
            } else if (appState.currentFilter !== 'all') {
                // 如果没有找到编码字段，但用户点击了筛选，这里可以给出提示，目前默认显示空
                console.warn("数据中未找到类似'编码'或'code'的字段，无法精确筛选");
            }

            // --- 更新统计面板 ---
            updateStats(dataArray, codeHeader);

            // --- 渲染表头 ---
            const thead = document.getElementById('tableHead');
            let headerHTML = '<tr><th class="px-4 py-3 w-12 text-center">#</th>';
            headers.forEach(h => {
                // 高亮可能得编码列
                const isCodeCol = h === codeHeader;
                headerHTML += `<th class="px-4 py-3 whitespace-nowrap ${isCodeCol ? 'text-apple-blue' : ''}">${h}</th>`;
            });
            headerHTML += '</tr>';
            thead.innerHTML = headerHTML;

            // --- 渲染表身 ---
            const tbody = document.getElementById('tableBody');
            let bodyHTML = '';
            
            if (filteredData.length === 0) {
                bodyHTML = `<tr><td colspan="${headers.length + 1}" class="px-4 py-8 text-center text-gray-500">当前筛选条件下无数据</td></tr>`;
            } else {
                filteredData.forEach((row, index) => {
                    bodyHTML += `<tr><td class="px-4 py-3 text-center text-gray-400 text-xs">${index + 1}</td>`;
                    headers.forEach(h => {
                        let val = row[h];
                        // 处理对象或数组的显示
                        if (typeof val === 'object' && val !== null) {
                            val = '[复杂对象]';
                        } else if (val === undefined || val === null) {
                            val = '<span class="text-gray-300">-</span>';
                        }
                        
                        const isCodeCol = h === codeHeader;
                        bodyHTML += `<td class="px-4 py-3 whitespace-nowrap ${isCodeCol ? 'font-medium' : ''}">${val}</td>`;
                    });
                    bodyHTML += '</tr>';
                });
            }
            tbody.innerHTML = bodyHTML;
        }

        // --- STREAMING_CHUNK:统计与筛选逻辑 ---
        
        function updateStats(dataArray, codeHeader) {
            const total = dataArray.length;
            document.getElementById('totalSitesCount').innerText = total;

            // 计算有无编码的数量用于控制台日志或未来扩展
            if (codeHeader) {
                const hasCodeCount = dataArray.filter(item => item[codeHeader] && item[codeHeader].toString().trim() !== '').length;
                const noCodeCount = total - hasCodeCount;
                console.log(`统计更新：总计 ${total}, 有编码 ${hasCodeCount}, 无编码 ${noCodeCount}`);
            }
        }

        function setFilter(filterType) {
            appState.currentFilter = filterType;
            updateFilterUI();
            
            // 重新渲染当前任务的表格数据
            if (appState.currentTaskId) {
                const task = appState.tasks.find(t => t.id === appState.currentTaskId);
                if (task && task.jsonData) {
                    renderTable(task.jsonData);
                }
            }
        }

        function updateFilterUI() {
            const btnClasses = {
                active: ['bg-white', 'shadow-sm', 'text-apple-text'],
                inactive: ['text-gray-500', 'hover:text-apple-text', 'bg-transparent', 'shadow-none']
            };

            const btns = {
                'all': document.getElementById('filter-all'),
                'has_code': document.getElementById('filter-has-code'),
                'no_code': document.getElementById('filter-no-code')
            };

            // 重置所有按钮样式
            Object.values(btns).forEach(btn => {
                btn.classList.remove(...btnClasses.active);
                btn.classList.add(...btnClasses.inactive);
            });

            // 激活当前选中按钮样式
            if (btns[appState.currentFilter]) {
                btns[appState.currentFilter].classList.remove(...btnClasses.inactive);
                btns[appState.currentFilter].classList.add(...btnClasses.active);
            }
        }

        // 页面加载完成后初始化
        window.onload = initApp;

    </script>
</body>
</html>
